<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wristzone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .background-clip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .content {
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        .content h1 {
            font-size: 4rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .content h1.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            font-size: 1.5rem;
            color: #fff;
            text-decoration: none;
            border: 2px solid #fff;
            padding: 15px 30px;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-block;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2));
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s, background-color 0.3s ease, color 0.3s ease;
        }

        .btn.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        /* Mobile Devices */
        @media (max-width: 768px) {
            .background-clip {
                width: 100%;
                height: auto;
                min-height: 100vh;
                object-fit: cover;
            }

            .content h1 {
                font-size: 2rem;
                margin-bottom: 1.5rem;
            }

            .btn {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }

        /* Tablets */
        @media (min-width: 769px) and (max-width: 1024px) {
            .content h1 {
                font-size: 3rem;
            }

            .btn {
                font-size: 1.2rem;
                padding: 12px 25px;
            }
        }

        /* Desktops */
        @media (min-width: 1025px) {
            .background-clip {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <video autoplay loop muted playsinline class="background-clip">
            <source src="video/ar.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="content">
            <h1>WELCOME TO ETERNALUXURY</h1>
            <a href="1.html" class="btn">Discover Now</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const h1 = document.querySelector('.content h1');
            const btn = document.querySelector('.btn');

            // Add visible class to trigger animations
            setTimeout(() => {
                h1.classList.add('visible');
                btn.classList.add('visible');
            }, 100);

            // Adjust video size on window resize
            const video = document.querySelector('.background-clip');
            const adjustVideoSize = () => {
                if (window.innerWidth <= 768) {
                    video.style.width = '100%';
                    video.style.height = 'auto';
                } else {
                    video.style.width = '100%';
                    video.style.height = '100%';
                }
            };

            adjustVideoSize();
            window.addEventListener('resize', adjustVideoSize);
        });
    </script>
</body>

</html>
